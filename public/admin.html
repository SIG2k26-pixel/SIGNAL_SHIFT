<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Shift Admin | Registrations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-container">
    <!-- LOGIN -->
    <div class="admin-login" id="admin-login">
      <h2 class="section-title">Admin Portal</h2>
      <div class="form-container" style="max-width:400px">
        <div class="form-group">
          <label for="admin-pass">Password</label>
          <input type="password" id="admin-pass" placeholder="Enter admin password">
        </div>
        <button class="submit-btn" id="login-btn"><span class="btn-text">Login</span></button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="admin-dash" style="display:none">
      <div class="admin-header">
        <h2 class="section-title" style="margin-bottom:0;text-align:left">Signal Shift Registrations</h2>
        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
          <input type="text" class="search-input" id="search" placeholder="🔍 Search registrations...">
          <button class="modal-btn" id="export-btn">📥 Export CSV</button>
          <a href="/" class="modal-btn outline" style="text-decoration:none">← Back</a>
        </div>
      </div>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total</span></div>
        <div class="stat-card"><span class="stat-num" id="stat-latest">—</span><span class="stat-label">Latest</span></div>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th><th>Timestamp</th><th>Name</th><th>Reg No</th><th>Email</th>
              <th>Phone</th><th>Department</th><th>College</th><th>Team</th><th>Txn ID</th>
            </tr>
          </thead>
          <tbody id="reg-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
